syntax = "proto3";

package redpanda.core.admin.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "proto/redpanda/core/pbgen/options.proto";
import "proto/redpanda/core/pbgen/rpc.proto";

option (pbgen.cpp_namespace) = "proto::admin";

service SecurityService {
    rpc CreateScramCredential(CreateScramCredentialRequest) returns (CreateScramCredentialResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc GetScramCredentials(GetScramCredentialsRequest) returns (GetScramCredentialsResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc ListScramCredentials(ListScramCredentialsRequest) returns (ListScramCredentialsResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc UpdateScramCredential(UpdateScramCredentialRequest) returns (UpdateScramCredentialResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc DeleteScramCredential(DeleteScramCredentialRequest) returns (DeleteScramCredentialResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc BatchGetRoles(BatchGetRolesRequest) returns (BatchGetRolesResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    };

    rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc EnumerateCurrentUserRoles(EnumerateCurrentUserRolesRequest) returns (EnumerateCurrentUserRolesResponse) {
        option (pbgen.rpc) = {
            authz: USER
        };
    }

    rpc EnumerateRoleMembers(EnumerateRoleMembersRequest) returns (EnumerateRoleMembersResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc AddRoleMembers(AddRoleMembersRequest) returns (AddRoleMembersResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc RemoveRoleMembers(RemoveRoleMembersRequest) returns (RemoveRoleMembersResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc ResolveOidcIdentity(ResolveOidcIdentityRequest) returns (ResolveOidcIdentityResponse) {
        option (pbgen.rpc) = {
            authz: USER
        };
    }

    rpc RefreshOidcKeys(RefreshOidcKeysRequest) returns (RefreshOidcKeysResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc RevokeOidcCredentials(RevokeOidcCredentialsRequest) returns (RevokeOidcCredentialsResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    rpc GenerateSecurityReport(GenerateSecurityReportRequest) returns (GenerateSecurityReportResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

// =============================================
/* Resources */
// =============================================
// SCRAM credential resource for user authentication
message ScramCredential {
    option (google.api.resource) = {
        type: "redpanda.core.admin.SecurityService/ScramCredential"
        pattern: "scram_credentials/{scram_credential}"
    };

    // See [AIP-203](https://google.aip.dev/203#identifier) for details on IDENTIFIER.
    string name = 1 [(google.api.field_behavior) = IDENTIFIER];

    enum ScramMechanism {
        SCRAM_MECHANISM_UNSPECIFIED = 0;
        SCRAM_SHA_256 = 1;
        SCRAM_SHA_512 = 2;
    }

    ScramMechanism mechanism = 2;

    string password = 3 [
        debug_redact = true,
        (google.api.field_behavior) = INPUT_ONLY
    ];

    google.protobuf.Timestamp created_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Role {
    option (google.api.resource) = {
        type: "redpanda.core.admin.SecurityService/Role"
        pattern: "roles/{role}"
    };

    string name = 1 [(google.api.field_behavior) = IDENTIFIER];
}

// =============================================
/* RPC Requests and Responses */
// =============================================
message CreateScramCredentialRequest {
    string username = 1 [(google.api.field_behavior) = REQUIRED];

    ScramCredential scram_credential = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateScramCredentialResponse {
    ScramCredential scram_credential = 1;
}

message GetScramCredentialsRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/ScramCredential"
        }
    ];
}

message GetScramCredentialsResponse {
    ScramCredential scram_credential = 1;
}

message ListScramCredentialsRequest {
    // If true, include ephemeral users in the response
    bool include_ephemeral = 1;
}

message ListScramCredentialsResponse {
    repeated ScramCredential scram_credential = 1;
}

message UpdateScramCredentialRequest {
    ScramCredential scram_credential = 1 [(google.api.field_behavior) = REQUIRED];

    // The list of fields to update
    // See [AIP-134](https://google.aip.dev/134) for how to use `field_mask`
    google.protobuf.FieldMask update_mask = 2;
}

message UpdateScramCredentialResponse {
    ScramCredential scram_credential = 1;
}

message DeleteScramCredentialRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/ScramCredential"
        }
    ];
}

message DeleteScramCredentialResponse {}

message CreateRoleRequest {
    string role_name = 1 [(google.api.field_behavior) = REQUIRED];

    Role role = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateRoleResponse {
    Role role = 1;
}

message GetRoleRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];
}

message GetRoleResponse {
    Role role = 1;
}

message BatchGetRolesRequest {
    repeated string names = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];
}

message BatchGetRolesResponse {
    repeated Role roles = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
    repeated Role roles = 1;
}

message UpdateRoleRequest {
    Role role = 1 [(google.api.field_behavior) = REQUIRED];

    // The list of fields to update
    // See [AIP-134](https://google.aip.dev/134) for how to use `field_mask`
    google.protobuf.FieldMask update_mask = 2;

    // If set to true, and the role is not found, a new role will be created.
    // In this situation, `update_mask` is ignored.
    // References:
    // - https://google.aip.dev/134#create-or-update
    bool allow_missing = 3;
}

message UpdateRoleResponse {
    Role role = 1;
}

message DeleteRoleRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];

    // If true, delete all ACLs associated with this role
    bool delete_acls = 2;
}

message DeleteRoleResponse {}

message EnumerateCurrentUserRolesRequest {}

message EnumerateCurrentUserRolesResponse {
    // The names of the roles the current user is a member of.
    // Not returning the full Role resources to avoid leaking information
    // about other members of the roles. If a superuser wants that 
    // information, they can then call BatchGetRoles using these role names.
    repeated string roles = 1 [
        (google.api.field_behavior) = OUTPUT_ONLY,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];
}

message EnumerateRoleMembersRequest {
    string role_name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];
}

message EnumerateRoleMembersResponse {
    repeated RoleMember members = 1 [
        (google.api.field_behavior) = OUTPUT_ONLY
    ];
}

message AddRoleMembersRequest {
    string role_name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];

    repeated RoleMember members = 2 [
        (google.api.field_behavior) = REQUIRED
    ];
}

message AddRoleMembersResponse {}

message RemoveRoleMembersRequest {
    string role_name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.SecurityService/Role"
        }
    ];

    repeated RoleMember members = 2 [
        (google.api.field_behavior) = REQUIRED
    ];
}

message RemoveRoleMembersResponse {}

message ResolveOidcIdentityRequest {}

message ResolveOidcIdentityResponse {
    // Mapped principal for authorization.
    // ❓: Is there a better name for this field (e.g. subject or acl principal name)?
    // ❓: Do we want to expand upon this to include more OIDC claims?
    string id = 1;

    // Unix timestamp of the expiry of the token.
    google.protobuf.Timestamp expire = 2;
}

message RefreshOidcKeysRequest {}

message RefreshOidcKeysResponse {}

message RevokeOidcCredentialsRequest {}

message RevokeOidcCredentialsResponse {}

message GenerateSecurityReportRequest {}

message GenerateSecurityReportResponse {
    SecurityReport report = 1;
}

// =============================================
/* Other Messages */
// =============================================
message RoleUser {
    string name = 1;
}

// message RoleGroup {
//     string name = 1;
// }

message RoleMember {
    oneof member {
        RoleUser user = 1;
        // RoleGroup group = 2;
    }
}

// Main security report structure
message SecurityReport {
    // Interface-specific security reports
    InterfacesReport interfaces = 1;

    // Security alerts
    repeated SecurityReportAlert alerts = 2;
}

// Container for all interface reports
message InterfacesReport {
    // Kafka interface reports
    repeated KafkaInterfaceSecurityReport kafka = 1;

    // RPC interface report
    RpcInterfaceSecurityReport rpc = 2;

    // Admin interface reports
    repeated AdminInterfaceSecurityReport admin = 3;

    // Schema registry interface reports
    repeated SchemaRegistryInterfaceSecurityReport schema_registry = 4;

    // Schema registry client report
    ClientSecurityReport schema_registry_client = 5;

    // HTTP Proxy interface reports
    repeated HttpProxyInterfaceSecurityReport http_proxy = 6;

    // Audit log client report
    ClientSecurityReport audit_log_client = 7;
}

// Host and port pair
message HostPort {
    // Host address
    string host = 1;

    // Port number
    int32 port = 2;
}

// Security report for Kafka interfaces
message KafkaInterfaceSecurityReport {
    // Authentication method enum for Kafka
    enum AuthenticationMethod {
        AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        SASL = 1;
        MTLS = 2;
        NONE = 3;
    }

    // Interface name
    string name = 1;

    // Host and port
    HostPort endpoint = 2;

    // Advertised host and port
    HostPort advertised_endpoint = 3;

    // TLS enabled flag
    bool tls_enabled = 4;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 5;

    // Authentication method
    AuthenticationMethod authentication_method = 6;

    // Authorization enabled flag
    bool authorization_enabled = 7;

    // Supported SASL mechanisms
    repeated string supported_sasl_mechanisms = 8;
}

// Security report for RPC interface
message RpcInterfaceSecurityReport {
    // Host and port
    HostPort endpoint = 1;

    // Advertised host and port
    HostPort advertised_endpoint = 2;

    // TLS enabled flag
    bool tls_enabled = 3;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 4;
}

// Security report for Admin interfaces
message AdminInterfaceSecurityReport {
    // Authentication method enum for Admin
    enum AuthenticationMethod {
        AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        BASIC = 1;
        OIDC = 2;
    }

    // Interface name
    string name = 1;

    // Host and port
    HostPort endpoint = 2;

    // TLS enabled flag
    bool tls_enabled = 3;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 4;

    // Authentication methods
    repeated AuthenticationMethod authentication_methods = 5;

    // Authorization enabled flag
    bool authorization_enabled = 6;
}

// Security report for Schema Registry interfaces
message SchemaRegistryInterfaceSecurityReport {
    // Authentication method enum for Schema Registry
    enum AuthenticationMethod {
        AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        BASIC = 1;
        OIDC = 2;
    }

    // Interface name
    string name = 1;

    // Host and port
    HostPort endpoint = 2;

    // TLS enabled flag
    bool tls_enabled = 3;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 4;

    // Authentication methods
    repeated AuthenticationMethod authentication_methods = 5;

    // Authorization enabled flag
    bool authorization_enabled = 6;
}

// Security report for HTTP Proxy interfaces
message HttpProxyInterfaceSecurityReport {
    // Authentication method enum for HTTP Proxy client
    enum ConfiguredAuthenticationMethod {
        CONFIGURED_AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        NONE = 1;
        SCRAM_CONFIGURED = 2;
        SCRAM_PROXIED = 3;
    }

    // Authentication method enum for HTTP Proxy interface
    enum AuthenticationMethod {
        AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        BASIC = 1;
        OIDC = 2;
    }

    // Interface name
    string name = 1;

    // Host and port
    HostPort endpoint = 2;

    // Advertised host and port
    HostPort advertised_endpoint = 3;

    // TLS enabled flag
    bool tls_enabled = 4;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 5;

    // Authentication methods for the interface
    repeated AuthenticationMethod authentication_methods = 6;

    // Authorization enabled flag
    bool authorization_enabled = 7;

    // Configured authentication method for client connections
    ConfiguredAuthenticationMethod configured_authentication_method = 8;
}

// Security report for client interfaces
message ClientSecurityReport {
    // Authentication method enum for clients
    enum ConfiguredAuthenticationMethod {
        CONFIGURED_AUTHENTICATION_METHOD_UNSPECIFIED = 0;
        NONE = 1;
        SCRAM_CONFIGURED = 2;
        SCRAM_EPHEMERAL = 3;
    }

    // Kafka listener name
    string kafka_listener_name = 1;

    // Broker endpoints
    repeated HostPort brokers = 2;

    // TLS enabled flag
    bool tls_enabled = 3;

    // Mutual TLS enabled flag
    bool mutual_tls_enabled = 4;

    // Configured authentication method
    ConfiguredAuthenticationMethod configured_authentication_method = 5;
}

// Security alert information
message SecurityReportAlert {
    // Affected interface enum
    enum AffectedInterface {
        AFFECTED_INTERFACE_UNSPECIFIED = 0;
        KAFKA = 1;
        RPC = 2;
        ADMIN = 3;
        SCHEMA_REGISTRY = 4;
        SCHEMA_REGISTRY_CLIENT = 5;
        HTTP_PROXY = 6;
        AUDIT_LOG_CLIENT = 7;
    }

    // Issue type enum
    enum Issue {
        ISSUE_UNSPECIFIED = 0;
        NO_TLS = 1;
        NO_AUTHN = 2;
        NO_AUTHZ = 3;
        SASL_PLAIN = 4;
        HTTP_PROXY_CONFIGURED_CLIENT = 5;
        INSECURE_MIN_TLS_VERSION = 6;
        TLS_RENEGOTIATION = 7;
    }

    // Affected interface
    AffectedInterface affected_interface = 1;

    // Listener name (optional)
    string listener_name = 2;

    // Issue type
    Issue issue = 3;

    // Human-readable description
    string description = 4;
}