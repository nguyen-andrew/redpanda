syntax = "proto3";

package redpanda.core.admin.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "proto/redpanda/core/pbgen/options.proto";
import "proto/redpanda/core/pbgen/rpc.proto";

option (pbgen.cpp_namespace) = "proto::admin::security";

service UserService {
    // POST /v1/security/users
    // Create user
    // References:
    // - https://google.aip.dev/133
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // GET /v1/security/users
    // List users
    // References:
    // - https://google.aip.dev/132
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // DELETE /v1/security/users/{user}
    // Delete user
    // References:
    // - https://google.aip.dev/135
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // PUT /v1/security/users/{user}
    // Update user
    // References:
    // - https://google.aip.dev/134
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

service RoleService {
    // POST /v1/security/roles
    // Create a role
    // References:
    // - https://google.aip.dev/133
    rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // GET /v1/security/roles/{role}
    // Get role
    // References:
    // - https://google.aip.dev/131
    rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // GET /v1/security/roles
    // List roles
    // References:
    // - https://google.aip.dev/132
    rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }

    // DELETE /v1/security/roles/{role}
    // Remove a role by name
    // References:
    // - https://google.aip.dev/135
    rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

// =============================================
/* Resources */
// =============================================
// A User resource
// References:
// - https://google.aip.dev/122
message User {
    // References:
    // - https://google.aip.dev/123
    option (google.api.resource) = {
        type: "redpanda.core.admin.UserService/User"
        pattern: "users/{user}"
    };
    
    // Resource name
    // Format: users/{name}
    // IDENTIFIER = OUTPUT_ONLY & IMMUTABLE
    // References:
    // - https://google.aip.dev/122#fields-representing-resource-names
    // - https://google.aip.dev/148#resource-names-and-ids
    // - https://google.aip.dev/203#identifier
    string name = 1 [(google.api.field_behavior) = IDENTIFIER];

    // The user's name
    string user_name = 2 [(google.api.field_behavior) = REQUIRED];
}

// A Role resource
// References:
// - https://google.aip.dev/122
message Role {
    // References:
    // - https://google.aip.dev/123
    option (google.api.resource) = {
        type: "redpanda.core.admin.RoleService/Role"
        pattern: "roles/{role}"
    };

    // Resource name
    // Format: roles/{role}
    // IDENTIFIER = OUTPUT_ONLY & IMMUTABLE
    // References:
    // - https://google.aip.dev/122#fields-representing-resource-names
    // - https://google.aip.dev/148#resource-names-and-ids
    // - https://google.aip.dev/203#identifier
    string name = 1 [(google.api.field_behavior) = IDENTIFIER];

    // The role's name
    string role_name = 2 [(google.api.field_behavior) = REQUIRED];

    // The members associated with this role
    repeated RoleMember members = 3;
}

// =============================================
/* RPC Requests and Responses */
// =============================================
// Request message for creating a user
// References:
// - https://google.aip.dev/133#request-message
message CreateUserRequest {
    // The user to create
    User user = 1;

    // ❓: Should this be in the User message instead?
    // The user's SCRAM credentials
    ScramCredential credential = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

// Response message for creating a user
// References:
// - https://google.aip.dev/133
message CreateUserResponse {
    // The created user
    User user = 1;
}

// Request message for listing users
// References:
// - https://google.aip.dev/132#request-message
message ListUsersRequest {
    // The maximum number of users to return. The service may return fewer than
    // this value. If unspecified, at most 50 users will be returned. Note that 
    // paging is currently not fully supported, and this field only acts as a 
    // limit for the first page of data returned. Subsequent pages of data cannot
    // be requested.
    // References:
    // - https://google.aip.dev/158
    int32 page_size = 1;
    
    // A filter expression that filters users listed in the response.
    // The expression must follow the syntax outlined in AIP-160.
    // References:
    // - https://google.aip.dev/132#filtering
    // - https://google.aip.dev/160
    string filter = 2;

    // Field-based ordering specification following AIP-132 syntax.
    // Supports multiple fields with `asc`/`desc` direction indicators.
    // Example:
    // - `user_name desc` - alphabetical order by user name, descending
    // References:
    // - https://google.aip.dev/132#ordering
    string order_by = 3;

    // The number of users to skip before starting to collect the result set.
    // References:
    // - https://google.aip.dev/158#skipping-results
    int64 skip = 4;
    
    // If true, include ephemeral users in the response
    bool include_ephemeral = 5;
}

// Response message for listing users
// References:
// - https://google.aip.dev/132#response-message
message ListUsersResponse {
    // The users from the specified collection
    repeated User users = 1;
}

// Request message for deleting a user
// References:
// - https://google.aip.dev/135#request-message
message DeleteUserRequest {
    // The name of the user to delete.
    // Format: users/{user}
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.UserService/User"
        }
    ];
}

// Response message for deleting a user
// References:
// - https://google.aip.dev/135
message DeleteUserResponse {
    // Empty response for successful deletion
}

// Request message for updating a user
// References:
// - http://google.aip.dev/134#request-message
message UpdateUserRequest {
    // The user to update.
    //
    // The user's `name` field is used to identify the user to update.
    // Format: users/{user}
    User user = 1 [(google.api.field_behavior) = REQUIRED];

    // ❓: Should this be in the User message instead?
    // The SCRAM credential to update for the user
    ScramCredential credential = 2;

    // The list of fields to update.
    // References:
    // - https://protobuf.dev/reference/protobuf/google.protobuf/#field-mask
    google.protobuf.FieldMask update_mask = 3;
}

// Response message for updating a user
// References:
// - http://google.aip.dev/134
message UpdateUserResponse {
    // The updated user
    User user = 1;
}

// Request message for creating a role
// References:
// - https://google.aip.dev/133#request-message
message CreateRoleRequest {
    // The role to create
    Role role = 1;
}

// Response message for creating a role
// References:
// - https://google.aip.dev/133
message CreateRoleResponse {
    // The created role
    Role role = 1;
}

// Request message for getting a role
// References:
// - https://google.aip.dev/131#request-message
message GetRoleRequest {
    // The name of the role to retrieve.
    // Format: roles/{role}
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.RoleService/Role"
        }
    ];
}

// Response message for getting a role
// References:
// - https://google.aip.dev/131
message GetRoleResponse {
    // The retrieved role
    Role role = 1;
}

// Request message for listing roles
// References:
// - https://google.aip.dev/132#request-message
message ListRolesRequest {
    // The maximum number of roles to return. The service may return fewer than
    // this value. If unspecified, at most 50 roles will be returned. Note that
    // paging is currently not fully supported, and this field only acts as a 
    // limit for the first page of data returned. Subsequent pages of data cannot
    // be requested.
    // References:
    // - https://google.aip.dev/158
    int32 page_size = 1;

    // A filter expression that filters roles listed in the response.
    // The expression must follow the syntax outlined in AIP-160.
    // References:
    // - https://google.aip.dev/132#filtering
    // - https://google.aip.dev/160
    string filter = 2;

    // Field-based ordering specification following AIP-132 syntax.
    // Supports multiple fields with `asc`/`desc` direction indicators.
    // Example:
    // - `role_name desc` - alphabetical order by role name, descending
    // References:
    // - https://google.aip.dev/132#ordering
    string order_by = 3;

    // The number of roles to skip before starting to collect the result set.
    // References:
    // - https://google.aip.dev/158#skipping-results
    int64 skip = 4;
}

// Response message for listing roles
// References:
// - https://google.aip.dev/132#response-message
message ListRolesResponse {
    // The roles from the specified collection
    repeated Role roles = 1;
}

// Request message for deleting a role
// References:
// - https://google.aip.dev/135#request-message
message DeleteRoleRequest {
    // The name of the role to delete.
    // Format: roles/{role}
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.RoleService/Role"
        }
    ];

    // If true, delete all ACLs associated with this role
    bool delete_acls = 2;
}

// Response message for deleting a role
// References:
// - https://google.aip.dev/135
message DeleteRoleResponse {
    // Empty response for successful deletion
}

// =============================================
/* Other Messages */
// =============================================

// SCRAM credential for user authentication
message ScramCredential {
    // The SCRAM algorithm to use
    enum Algorithm {
        ALGORITHM_UNSPECIFIED = 0;
        SCRAM_SHA_256 = 1;
        SCRAM_SHA_512 = 2;
    }
    
    // The SCRAM algorithm
    Algorithm algorithm = 1;
    
    // The user's password
    // References:
    // - https://google.aip.dev/203#input-only
    string password = 2 [
        debug_redact = true,
        (google.api.field_behavior) = INPUT_ONLY
    ];
}

// A RoleMember represents a principal associated with a role
message RoleMember {
    enum PrincipalType {
        PRINCIPAL_TYPE_UNSPECIFIED = 0;
        USER = 1;
    }

    // The role member's name.
    string member_name = 1;

    // The role member's principal type.
    PrincipalType principal_type = 2;
}