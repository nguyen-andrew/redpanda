syntax = "proto3";

package redpanda.core.admin.v2;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "proto/redpanda/core/pbgen/options.proto";
import "proto/redpanda/core/pbgen/rpc.proto";

option (pbgen.cpp_namespace) = "proto::admin::security";

service UserService {
    // POST /v1/security/users
    // Create user
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

// =============================================
/* Resources */
// =============================================
// A User resource
message User {
    option (google.api.resource) = {
        type: "redpanda.core.admin.UserService/User"
        pattern: "users/{user}"
    };
    
    // Resource name
    // Format: users/{user}
    string name = 1 [(google.api.field_behavior) = IDENTIFIER];

    // The user's name
    string user_name = 2 [(google.api.field_behavior) = REQUIRED];
    
    // Whether this is an ephemeral user
    bool ephemeral = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// =============================================
/* RPC Requests and Responses */
// =============================================
// Request message for creating a user (AIP-133)
message CreateUserRequest {
    // The user to create
    User user = 1;

    // ❓: Should this be in the User message instead?
    // The user's SCRAM credentials
    ScramCredential credential = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

// Response message for creating a user (AIP-133)
message CreateUserResponse {
    // The created user
    User user = 1;
}

// =============================================
/* Other Messages */
// =============================================

// SCRAM credential for user authentication
message ScramCredential {
    // The SCRAM algorithm to use
    enum Algorithm {
        ALGORITHM_UNSPECIFIED = 0;
        SCRAM_SHA_256 = 1;
        SCRAM_SHA_512 = 2;
    }
    
    // The SCRAM algorithm
    Algorithm algorithm = 1;
    
    // The user's password
    string password = 2 [
        debug_redact = true,
        (google.api.field_behavior) = INPUT_ONLY
    ];
}